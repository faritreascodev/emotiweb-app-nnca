services:
  db:
    image: mysql:8.0
    container_name: emotiweb-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-emotiweb_db}
      MYSQL_USER: ${DB_USER:-emotiweb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-emotiweb_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emotiweb-network

  backend:
    build:
      context: ./backend
    container_name: emotiweb-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: emotiweb-mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-emotiweb_db}
      DB_USER: ${DB_USER:-emotiweb_user}
      DB_PASSWORD: ${DB_PASSWORD:-emotiweb_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-emotiweb.jwt.clave.nnca}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-emotiweb.refresh.clave.nnca}
      CORS_ORIGIN: ${FRONTEND_URL:-https://emotiweb.mltprdj.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://emotiweb.mltprdj.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - emotiweb-network

  frontend:
    build:
      context: ./frontend
    container_name: emotiweb-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
    networks:
      - emotiweb-network

volumes:
  mysql_data:

networks:
  emotiweb-network:
    driver: bridge
